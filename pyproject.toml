[project]
name = "masta"
version = "0.1.0"
description = "An AI-provider-agnostic coaching 'sensei': stateful goal coaching with pluggable domain coaches, both-sides reasoning, and rest reminders."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "masta contributors" }]
keywords = ["ai", "coaching", "llm", "agent", "cli", "litellm", "sensei"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "litellm>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "sqlmodel>=0.0.16",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "fastapi>=0.115",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# Optional extras for post-MVP features.
notify = ["desktop-notifier>=5.0"]
schedule = ["apscheduler>=3.10"]

[project.scripts]
masta = "masta.cli.app:app"

[project.urls]
Homepage = "https://github.com/your-org/masta"
Repository = "https://github.com/your-org/masta"
Issues = "https://github.com/your-org/masta/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masta"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
