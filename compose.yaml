services:
  masta:
    build: .
    image: masta:local
    # Provider API keys come from .env (`make up` creates it from .env.example).
    env_file:
      - .env
    ports:
      # Loopback only: the API has no authentication.
      - "127.0.0.1:${MASTA_PORT:-8000}:8000"
    volumes:
      - masta-data:/data
    extra_hosts:
      # Lets the container reach a model server on the host (e.g. Ollama) on Linux too.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  masta-data:
